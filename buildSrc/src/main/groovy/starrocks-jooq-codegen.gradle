import com.mysql.cj.jdbc.Driver
import java.time.Duration
import java.util.Properties
import liquibase.Contexts
import liquibase.LabelExpression
import liquibase.Liquibase
import liquibase.database.DatabaseFactory
import liquibase.database.jvm.JdbcConnection
import liquibase.resource.DirectoryResourceAccessor
import org.jooq.codegen.GenerationTool
import org.jooq.meta.jaxb.Configuration
import org.jooq.meta.jaxb.Database
import org.jooq.meta.jaxb.Generator
import org.jooq.meta.jaxb.Jdbc
import org.jooq.meta.jaxb.Target
import org.testcontainers.containers.GenericContainer
import org.testcontainers.containers.wait.strategy.Wait

def outputDir = project.layout.buildDirectory.dir('generated-jooq')

def generateJooq = tasks.register('generateJooq') {
    group = 'build'
    description = 'Applies Liquibase changes to disposable StarRocks and generates jOOQ classes'

    def migrationDir = project.hasProperty('jooqChangelogDir')
            ? project.file(project.property('jooqChangelogDir'))
            : project.file('src/main/resources/db/changelog')
    def packageName = project.property('jooqPackageName')
    def databaseName = project.findProperty('jooqDatabaseName') ?: 'pathlens_report'
    def imageName = project.findProperty('starrocksImage') ?: 'starrocks/allin1-ubuntu:3.5.21'

    inputs.dir(migrationDir)
    outputs.dir(outputDir)

    doLast {
        GenericContainer<?> container = new GenericContainer<>(imageName)
                .withExposedPorts(9030)
                .withCommand('/bin/sh', '-c', starRocksTestCommand())
                .waitingFor(Wait.forListeningPort().withStartupTimeout(Duration.ofMinutes(5)))

        container.start()
        try {
            String host = container.getHost()
            Integer port = container.getMappedPort(9030)
            String rootUrl = "jdbc:mysql://${host}:${port}/?useSSL=false&allowPublicKeyRetrieval=true"
            String jdbcUrl = "jdbc:mysql://${host}:${port}/${databaseName}" +
                    '?useSSL=false&allowPublicKeyRetrieval=true'
            def connectionProperties = new Properties()
            connectionProperties.setProperty('user', 'root')
            connectionProperties.setProperty('password', '')
            def driver = new Driver()
            waitForStarRocksBackend(driver, rootUrl, connectionProperties)

            driver.connect(rootUrl, connectionProperties).withCloseable { connection ->
                connection.createStatement().withCloseable { statement ->
                    statement.execute("CREATE DATABASE IF NOT EXISTS `${databaseName}`")
                }
            }

            driver.connect(jdbcUrl, connectionProperties).withCloseable { connection ->
                def database = DatabaseFactory.getInstance()
                        .findCorrectDatabaseImplementation(new JdbcConnection(connection))
                def resourceAccessor = new DirectoryResourceAccessor(migrationDir.toPath())
                def liquibase = new Liquibase(
                        'db.changelog-master.yaml', resourceAccessor, database)
                try {
                    liquibase.update(new Contexts(), new LabelExpression())
                } finally {
                    liquibase.close()
                }
            }

            def jdbc = new Jdbc(
                    driver: 'com.mysql.cj.jdbc.Driver', url: jdbcUrl, user: 'root', password: '')
            def database = new Database(
                    name: 'org.jooq.meta.jdbc.JDBCDatabase',
                    inputSchema: databaseName,
                    excludes: '(?i:DATABASECHANGELOG|DATABASECHANGELOGLOCK)')
            def target = new Target(
                    packageName: packageName, directory: outputDir.get().asFile.absolutePath)

            GenerationTool.generate(new Configuration(
                    jdbc: jdbc, generator: new Generator(database: database, target: target)))
        } finally {
            container.stop()
        }
    }
}

String starRocksTestCommand() {
    return '''mkdir -p /data/deploy/starrocks/fe/meta/bdb &&
        printf 'je.log.detectFileDelete=false\n' > /data/deploy/starrocks/fe/meta/bdb/je.properties &&
        rm -f /data/deploy/starrocks/fe/bin/fe.pid &&
        ./entrypoint.sh'''
}

void waitForStarRocksBackend(Driver driver, String jdbcUrl, Properties properties) {
    long deadline = System.nanoTime() + Duration.ofMinutes(5).toNanos()
    Exception lastFailure = null
    while (System.nanoTime() < deadline) {
        boolean backendAlive = false
        try {
            driver.connect(jdbcUrl, properties).withCloseable { connection ->
                connection.createStatement().withCloseable { statement ->
                    statement.executeQuery('SHOW BACKENDS').withCloseable { result ->
                        while (result.next()) {
                            if (result.getBoolean('Alive')) {
                                backendAlive = true
                            }
                        }
                    }
                }
            }
            if (backendAlive) {
                return
            }
        } catch (Exception exception) {
            lastFailure = exception
        }
        Thread.sleep(2000)
    }
    throw new GradleException('StarRocks did not register a live backend within 5 minutes', lastFailure)
}

sourceSets {
    main {
        java.srcDir(outputDir)
    }
}

tasks.named('compileJava') {
    dependsOn generateJooq
}

tasks.withType(Checkstyle).configureEach {
    exclude { element -> element.file.absolutePath.contains('generated-jooq') }
}

dependencies {
    api libs.jooq
    api libs.liquibase.core
    api libs.liquibase.starrocks
    runtimeOnly libs.mysql
}
