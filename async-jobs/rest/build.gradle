import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-conventions'
    id 'junit5-conventions'
    id 'org.springframework.boot'
    id 'docker-build'
}

dockerImage {
    imageName = 'async-jobs-rest'
    mainClass = 'ir.neo.asyncjobs.rest.ApplicationLauncher'
    imageTag = '1'
    jvmOpts = ['-XX:MaxRAMPercentage=75.0', '-XX:+ExitOnOutOfMemoryError']
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)

    implementation project(':async-jobs:model')
    implementation project(':async-jobs:async-jobs-common-repository')
    implementation project(':common-lib:pagination')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation libs.jackson.databind
    implementation libs.springDocWebmvc

    runtimeOnly libs.postgresql

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.junit.jupiter
    testImplementation libs.testcontainersPostgresql
    testImplementation libs.testcontainersJupiter
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add('-Xlint:-processing')
}
