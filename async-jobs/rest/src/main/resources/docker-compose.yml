services:
  postgres:
    image: postgres:16
    container_name: neo-async-jobs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neo
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: neo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neo -d neo"]
      interval: 5s
      timeout: 5s
      retries: 10
